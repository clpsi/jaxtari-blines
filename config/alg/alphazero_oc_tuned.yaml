# Gumbel MuZero search running on the real environment instead of a learned
# model: recurrent_fn calls env.step. Only possible because jaxatari states
# are pure pytrees that can be branched and batched inside the tree.
#
# No self-play, no learned dynamics - so this is AlphaZero in the sense of
# "planning with a perfect model", not a reproduction of Silver et al. (2017).
#
# Search: Danihelka et al. (2022), Policy improvement by planning with Gumbel
# Targets: Schrittwieser et al. (2019), arXiv 1911.08265

ALG: ALPHAZERO
EXP_NAME: alphazero

PIXEL_BASED: False
NATIVE_DOWNSCALING: True

TOTAL_TIMESTEPS: 10000000

# --- search ---
# Every acted step costs NUM_SIMULATIONS extra env steps inside the tree, so
# this is the throughput knob. Gumbel search still learns reliably at n=2 on
# ms_pacman where plain MuZero fails below n=4 (Danihelka Fig. 5a), and the
# reported training speedup from n=200 to n=16 is 11.3x (Table 1).
NUM_SIMULATIONS: 16

# Number of root actions sampled without replacement. The paper uses
# m = min(n, num_actions) on Atari; we compute that in code because the
# action count differs per game. Fixing it low hurts: m=4 slowed learning
# noticeably (Fig. 3b).
MAX_NUM_CONSIDERED_ACTIONS: null   # null => min(NUM_SIMULATIONS, action_dim)

# Scaling of the normalised Q-values against the policy logits inside the
# Gumbel selection rule. c_scale=1.0 is the Go/chess setting; Atari uses 0.1
# because reward scales differ wildly across games. Larger values make the
# search ignore the prior - that measurably hurt beam_rider (Fig. 5b), which
# is one of our 15 games.
GUMBEL_C_VISIT: 50
GUMBEL_C_SCALE: 0.1

# --- collection ---
NUM_ENVS: 128
TRAIN_FREQUENCY: 4
SCAN_STEPS: 100
GRADIENT_STEPS: 8

# --- replay ---
BUFFER_SIZE: 200000
LEARNING_STARTS: 20000
BATCH_SIZE: 512

# --- value target ---
GAMMA: 0.997          # MuZero follows R2D2 here rather than the usual 0.99
N_STEP: 10            # bootstrap after 10 real steps

# Values are predicted as a distribution over a fixed integer support after
# the invertible transform h(x) = sign(x)(sqrt(|x|+1) - 1 + eps*x). Without
# this the value loss does not survive games whose scores differ by orders of
# magnitude. 601 atoms, one per integer in [-300, 300].
SUPPORT_SIZE: 30
VALUE_TRANSFORM_EPS: 0.001

# --- loss ---
# Policy target is the improved policy from the search (mctx action_weights),
# not raw visit counts - the whole point of the Gumbel formulation.
POLICY_LOSS_COEF: 1.0
VALUE_LOSS_COEF: 1.0   # 1.0 in plain MuZero; the 0.25 often quoted belongs
                       # to MuZero Reanalyze, which we do not implement

# --- optimisation ---
LEARNING_RATE: 3.0e-4
ANNEAL_LR: True
MAX_GRAD_NORM: 0.5
WEIGHT_DECAY: 1.0e-4

# Rollout length per collection block. Comfortably larger than N_STEP so the
# bootstrap shortcut at the rollout boundary affects only few samples.
NUM_STEPS: 32